services:
  db:
    image: mysql:8.4
    container_name: melipona-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${DB_NAME:-melipona}
      MYSQL_USER: ${DB_USER:-melipona}
      MYSQL_PASSWORD: ${DB_PASSWORD:-melipona_dev}
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - melipona_db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u${DB_USER:-melipona}",
          "-p${DB_PASSWORD:-melipona_dev}"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  melipona_db_data:
