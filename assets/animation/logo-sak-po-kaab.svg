<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Sak P'o' Kaab animado</title>
  <desc id="desc">Un contorno hexagonal se dibuja y una gota central realiza una pulsación suave. La animación se detiene con movimiento reducido.</desc>
  <style>
    :root { color: #1f4735; }
    .outline { fill: none; stroke: currentColor; stroke-width: 5; stroke-linejoin: round; stroke-dasharray: 400; animation: draw 1.5s ease-out both; }
    .drop { fill: currentColor; transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out 1.5s infinite; }
    @keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .outline, .drop { animation: none; } }
  </style>
  <path class="outline" d="M80 12 139 46v68l-59 34-59-34V46L80 12Z"/>
  <path class="drop" d="M80 47c-19 23-29 39-29 53a29 29 0 0 0 58 0c0-14-10-30-29-53Z"/>
</svg>
